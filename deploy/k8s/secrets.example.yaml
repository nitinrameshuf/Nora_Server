# Copy to secrets.yaml, fill in real values, then:  kubectl apply -f secrets.yaml
# secrets.yaml is gitignored — never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: nora-backend
  namespace: nora
stringData:
  DJANGO_SECRET_KEY: CHANGE-ME-long-random-string
  DJANGO_SUPERUSER_USERNAME: admin
  DJANGO_SUPERUSER_PASSWORD: CHANGE-ME
  DJANGO_SUPERUSER_EMAIL: you@example.com
---
apiVersion: v1
kind: Secret
metadata:
  name: nora-rabbitmq
  namespace: nora
stringData:
  RABBITMQ_DEFAULT_USER: nora
  RABBITMQ_DEFAULT_PASS: CHANGE-ME
