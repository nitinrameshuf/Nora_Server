# Story 18 — Scenario B: telemetry falsification (DDS-level MITM analogue).
# robot + operator + attacker(mitm) + capture sidecar, all in one pod.
# See docs/scenarios.md for the honest scope of this attack vs a true in-path MITM.
apiVersion: v1
kind: Pod
metadata:
  name: scenario-mitm
  namespace: security-lab
  labels:
    lab: nora
    scenario: mitm-falsification
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: nora-app2
  volumes:
    - name: artifacts
      emptyDir: {}
  containers:
    - name: robot
      image: nora/ros2-lab:latest
      imagePullPolicy: Never
      args: ["robot"]
      env:
        - { name: ROS_DOMAIN_ID, value: "42" }
        - { name: ROS_LOCALHOST_ONLY, value: "1" }

    - name: mission-control
      image: nora/ros2-lab:latest
      imagePullPolicy: Never
      args: ["mission-control"]
      env:
        - { name: ROS_DOMAIN_ID, value: "42" }
        - { name: ROS_LOCALHOST_ONLY, value: "1" }

    - name: attacker-mitm
      image: nora/ros2-lab:latest
      imagePullPolicy: Never
      args: ["mitm"]
      env:
        - { name: ROS_DOMAIN_ID, value: "42" }
        - { name: ROS_LOCALHOST_ONLY, value: "1" }
        - { name: FAKE_BATTERY, value: "99.0" }

    - name: capture
      image: nora/ros2-lab:latest
      imagePullPolicy: Never
      command: ["/bin/bash", "-lc"]
      args:
        - |
          source /opt/ros/humble/setup.bash
          mkdir -p /artifacts
          echo "capturing for ${CAPTURE_SECONDS:-90}s..."
          tcpdump -i lo -w /artifacts/rtps.pcap udp &
          TCPDUMP=$!
          ros2 bag record -a -o /artifacts/bag &
          BAG=$!
          sleep "${CAPTURE_SECONDS:-90}"
          kill "$TCPDUMP" "$BAG" 2>/dev/null || true
          sleep 3
          echo done > /artifacts/CAPTURE_DONE
          echo "capture complete; idling for artifact collection"
          sleep 3600
      env:
        - { name: ROS_DOMAIN_ID, value: "42" }
        - { name: ROS_LOCALHOST_ONLY, value: "1" }
        - { name: CAPTURE_SECONDS, value: "90" }
      securityContext:
        capabilities:
          add: ["NET_RAW"]
      volumeMounts:
        - name: artifacts
          mountPath: /artifacts
